<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan — Teman Air</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(160deg, var(--blue-50), var(--bg-soft));
    }
    .error-page__emoji { font-size: 6rem; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    .error-page h1 { color: var(--blue-700); margin-bottom: 12px; }
    .error-page p { color: var(--ink-soft); max-width: 480px; margin: 0 auto 32px; font-size: 1.1rem; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div class="error-page">
    <a href="index.html" class="brand" style="margin-bottom: 40px;">
      <img src="img/logo.svg" alt="" width="60" height="60">
      <span class="brand__text" style="font-size: 1.8rem;">Teman<span>Air</span></span>
    </a>
    <div class="error-page__emoji">🏊‍♂️</div>
    <h1>Waduh, Halaman Tidak Ditemukan</h1>
    <p>Sepertinya Anda tersasar di kolam yang salah. Halaman yang Anda cari tidak ada atau sudah dipindahkan.</p>
    <div style="display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;">
      <a href="index.html" class="btn btn--accent btn--lg">Kembali ke Beranda</a>
      <a href="index.html#daftar" class="btn btn--ghost btn--lg">Daftar Kelas</a>
    </div>
  </div>
</body>
</html>
